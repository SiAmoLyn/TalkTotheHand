# sisi-pilot PKG6 — flipped 2026-10-25: mini (.2) is the lighthouse.
# Credential paths are bare filenames: run from a directory holding
# ca.crt / mac-air.crt / mac-air.key flat beside this config.
pki:
  ca: ca.crt
  cert: mac-air.crt
  key: mac-air.key

static_host_map:
  "192.168.100.2": ["__MINI_TAILNET_IP__:4242"]

static_map:
  network: ip6

lighthouse:
  am_lighthouse: false
  hosts: ["192.168.100.2"]

relay:
  relays: ["192.168.100.2"]

listen:
  host: "::"
  port: 4242

tun:
  dev: nebula1

firewall:
  outbound:
    - port: any
      proto: any
      cidr: 192.168.100.0/24
  inbound:
    - port: any
      proto: any
      cidr: 192.168.100.0/24
